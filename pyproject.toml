[project]
name = "mcp-test"
version = "0.1.0"
description = "Servidor MCP de ejemplo (outreach) para probar en local y desplegar en Railway"
requires-python = ">=3.14"
dependencies = [
    "langchain-ollama>=1.1.0",
    "langchain[mcp]>=1.5.2",
    "langsmith>=0.15.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

# Es una aplicación, no una librería: no hace falta empaquetarla.
[tool.uv]
package = false
